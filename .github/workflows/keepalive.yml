name: keepalive

# نبض خارجي يوقظ خدمة Render المجانية ويمنعها من السبات
on:
  schedule:
    - cron: '*/10 * * * *'   # كل 10 دقائق (قد يؤخّره GitHub قليلاً)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 60 https://basra-realestate.onrender.com/ && exit 0
            echo "retry $i…"; sleep 20
          done
          # لا نُفشل المهمة إن استمر التعذّر (الإيقاظ البارد قد يتجاوز المهلة)
          exit 0
