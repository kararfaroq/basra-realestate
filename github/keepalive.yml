name: keepalive

# نبض خارجي احتياطي يوقظ خدمة Render المجانية إن نامت
# (النبض الداخلي في app.py يُبقيها دافئة؛ هذا يضمن الإيقاظ عند أي انقطاع).
on:
  schedule:
    - cron: '*/10 * * * *'   # كل 10 دقائق (قد يؤخّره GitHub قليلاً)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 60 https://fayha-platform.onrender.com/healthz && exit 0
            echo "retry $i…"; sleep 20
          done
          # لا نُفشل المهمة إن استمر التعذّر (الإيقاظ البارد قد يتجاوز المهلة)
          exit 0
